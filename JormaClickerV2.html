<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jorma Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121214;
      color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 960px;
      background: #1e1e24;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border: 1px solid #2d2d38;
    }

    @media (min-width: 768px) {
      .game-container {
        flex-direction: row;
        align-items: flex-start;
        padding: 25px;
      }
    }

    .left-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .right-section {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .stats-header {
      text-align: center;
      width: 100%;
      background: #252530;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #333342;
    }

    .counter {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 800;
      color: #7289da;
      text-shadow: 0 0 10px rgba(114, 137, 218, 0.3);
      word-break: break-word;
    }

    .sub-counter {
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      color: #a0a0b0;
      margin-top: 6px;
    }

    .click-area {
      position: relative;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .jorma-main-img {
      width: min(50vw, 210px);
      height: min(50vw, 210px);
      max-width: 210px;
      max-height: 210px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      border: 5px solid #7289da;
      box-shadow: 0 0 25px rgba(114, 137, 218, 0.4);
      transition: transform 0.08s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
    }

    .jorma-main-img:hover {
      box-shadow: 0 0 35px rgba(114, 137, 218, 0.7);
    }

    .jorma-main-img:active {
      transform: scale(0.92);
    }

    .floating-text {
      position: absolute;
      font-weight: bold;
      font-size: 1.3rem;
      color: #43b581;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
      z-index: 100;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-50px); }
    }

    .tabs {
      display: flex;
      width: 100%;
      gap: 10px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: #282834;
      color: #aaa;
      border: 1px solid #383848;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #7289da;
      color: #fff;
      border-color: #7289da;
      box-shadow: 0 0 10px rgba(114, 137, 218, 0.3);
    }

    .tab-content {
      width: 100%;
      height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .tab-panel.active {
      display: flex;
    }

    .tab-content::-webkit-scrollbar {
      width: 6px;
    }
    .tab-content::-webkit-scrollbar-thumb {
      background: #3a3a4c;
      border-radius: 3px;
    }

    .item-card {
      display: flex;
      align-items: center;
      background: #262632;
      border-radius: 12px;
      padding: 10px 12px;
      border: 2px solid #333344;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .item-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #555;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-desc {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 2px;
      line-height: 1.2;
    }

    .item-count {
      font-size: 0.8rem;
      color: #7289da;
      font-weight: 600;
      margin-top: 3px;
    }

    .buy-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background-color 0.2s, transform 0.1s;
      min-width: 80px;
      text-align: center;
      flex-shrink: 0;
    }

    .buy-btn.affordable {
      background-color: #2ecc71;
      color: #fff;
      box-shadow: 0 0 8px rgba(46, 204, 113, 0.4);
    }

    .buy-btn.affordable:hover {
      background-color: #27ae60;
    }

    .buy-btn.affordable:active {
      transform: scale(0.95);
    }

    .buy-btn.locked {
      background-color: #444452;
      color: #888898;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: #23272a;
      color: #43b581;
      border: 1px solid #43b581;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 1000;
      text-align: center;
      max-width: 90vw;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="left-section">
      <div class="stats-header">
        <div class="counter" id="clicks-display">0.00 Jorma Clicks</div>
        <div class="sub-counter" id="cps-display">Per sec: 0.00 | Click: +0.10</div>
      </div>

      <div class="click-area">
        <img id="jorma-clicker" class="jorma-main-img" 
             src="https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/Screenshot_20260920_223403_WhatsApp.png" 
             alt="Jorma Clicker">
      </div>
    </div>

    <div class="right-section">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('shop')">Shop</button>
        <button class="tab-btn" onclick="switchTab('upgrades')">Upgrades</button>
      </div>

      <div class="tab-content">
        <div id="shop-tab" class="tab-panel active"></div>
        <div id="upgrades-tab" class="tab-panel"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Progress Loaded</div>

  <script>
    const GAME_KEY = "jorma_clicker_save_v2";

    let state = {
      clicks: 0.00,
      lastSaved: Date.now(),
      producers: {
        clicker: { count: 0, cost: 2.50, baseCps: 0.10, mult: 1.15 },
        pirjo: { count: 0, cost: 10.00, baseCps: 1.50, mult: 1.18 },
        freaky: { count: 0, cost: 85.00, baseCps: 8.00, mult: 1.22 },
        alien: { count: 0, cost: 650.00, baseCps: 35.00, mult: 1.26 },
        pupu: { count: 0, cost: 4500.00, baseCps: 250.00, mult: 1.30 },
        happy: { count: 0, cost: 16000.00, baseCps: 1200.00, mult: 1.35 }
      },
      upgrades: {
        clicker_speed: { bought: false, cost: 50.0 },
        pirjo_boost: { bought: false, cost: 250.0 },
        freaky_aura: { bought: false, cost: 1800.0 },
        pupu_charge: { bought: false, cost: 25000.0 },
        happy_transcendence: { bought: false, cost: 95000.0 }
      }
    };

    const PRODUCER_CONFIG = {
      clicker: {
        name: "Clicker",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/Screenshot_20260920_223403_WhatsApp.png",
        desc: "Adds +0.10 clicks per second."
      },
      pirjo: {
        name: "Pirjo",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/Screenshot_20260920_223346_WhatsApp.png",
        desc: "Adds +1.50 CPS and +0.10 to manual clicks."
      },
      freaky: {
        name: "Freaky Jorma",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/IMG-20260416-WA0013.jpg",
        desc: "Adds +8.00 CPS."
      },
      alien: {
        name: "Alien Jorma",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/Snapchat-99313567.jpg",
        desc: "Adds +35.00 CPS."
      },
      pupu: {
        name: "Pupu Jorma",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/20251006_135338.png",
        desc: "Adds +250.00 CPS."
      },
      happy: {
        name: "Happy Jorma",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/Snapchat-1211826836.jpg",
        desc: "Adds +1,200.00 CPS."
      }
    };

    const UPGRADE_CONFIG = {
      clicker_speed: {
        name: "Faster Clickers",
        desc: "Doubles Clicker CPS.",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/Screenshot_20260920_223403_WhatsApp.png"
      },
      pirjo_boost: {
        name: "Pirjo Boost",
        desc: "Makes Pirjos 2x better.",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/Screenshot_20260920_223346_WhatsApp.png"
      },
      freaky_aura: {
        name: "Freaky Upgrade",
        desc: "Doubles Freaky Jorma CPS and gives +1.0 click power.",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/IMG-20260416-WA0013.jpg"
      },
      pupu_charge: {
        name: "Pupu Upgrade",
        desc: "Doubles Pupu Jorma CPS.",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/20251006_135338.png"
      },
      happy_transcendence: {
        name: "Happy Upgrade",
        desc: "Doubles Happy Jorma CPS.",
        img: "https://raw.githubusercontent.com/jorma12311-sys/JormaClicker/main/Snapchat-1211826836.jpg"
      }
    };

    function getClickPower() {
      let base = 0.10;
      base += state.producers.pirjo.count * 0.10;
      if (state.upgrades.freaky_aura.bought) {
        base += 1.00;
      }
      return base;
    }

    function getTotalCps() {
      let cps = 0;
      const clickerMult = state.upgrades.clicker_speed.bought ? 2 : 1;
      cps += state.producers.clicker.count * state.producers.clicker.baseCps * clickerMult;

      const pirjoMult = state.upgrades.pirjo_boost.bought ? 2 : 1;
      cps += state.producers.pirjo.count * state.producers.pirjo.baseCps * pirjoMult;

      const freakyMult = state.upgrades.freaky_aura.bought ? 2 : 1;
      cps += state.producers.freaky.count * state.producers.freaky.baseCps * freakyMult;

      cps += state.producers.alien.count * state.producers.alien.baseCps;

      const pupuMult = state.upgrades.pupu_charge.bought ? 2 : 1;
      cps += state.producers.pupu.count * state.producers.pupu.baseCps * pupuMult;

      const happyMult = state.upgrades.happy_transcendence.bought ? 2 : 1;
      cps += state.producers.happy.count * state.producers.happy.baseCps * happyMult;

      return cps;
    }

    const jormaBtn = document.getElementById("jorma-clicker");

    function handlePrimaryClick(e) {
      e.preventDefault();
      const gain = getClickPower();
      state.clicks += gain;
      createFloatingText(e, `+${gain.toFixed(2)}`);
      updateUI();
    }

    jormaBtn.addEventListener("touchstart", (e) => {
      const touch = e.touches[0];
      handlePrimaryClick({ clientX: touch.clientX, clientY: touch.clientY, preventDefault: () => {} });
    }, { passive: false });

    jormaBtn.addEventListener("click", (e) => {
      if (e.pointerType !== "touch") {
        handlePrimaryClick(e);
      }
    });

    function createFloatingText(e, text) {
      const el = document.createElement("div");
      el.className = "floating-text";
      el.innerText = text;

      const rect = jormaBtn.getBoundingClientRect();
      const x = (e.clientX || (rect.left + rect.width / 2)) - rect.left - 20;
      const y = (e.clientY || (rect.top + rect.height / 2)) - rect.top - 10;

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;

      jormaBtn.parentElement.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function buyProducer(id) {
      const prod = state.producers[id];
      if (state.clicks >= prod.cost) {
        state.clicks -= prod.cost;
        prod.count++;
        prod.cost = prod.cost * prod.mult;
        updateUI();
        renderShop();
      }
    }

    function buyUpgrade(id) {
      const upg = state.upgrades[id];
      if (!upg.bought && state.clicks >= upg.cost) {
        state.clicks -= upg.cost;
        upg.bought = true;
        updateUI();
        renderUpgrades();
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(panel => panel.classList.remove("active"));

      if (tabName === "shop") {
        document.querySelectorAll(".tab-btn")[0].classList.add("active");
        document.getElementById("shop-tab").classList.add("active");
      } else {
        document.querySelectorAll(".tab-btn")[1].classList.add("active");
        document.getElementById("upgrades-tab").classList.add("active");
      }
    }

    function renderShop() {
      const container = document.getElementById("shop-tab");
      container.innerHTML = "";

      for (let key in state.producers) {
        const prod = state.producers[key];
        const conf = PRODUCER_CONFIG[key];
        const affordable = state.clicks >= prod.cost;

        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <img src="${conf.img}" class="item-img" alt="${conf.name}">
          <div class="item-info">
            <div class="item-title">${conf.name}</div>
            <div class="item-desc">${conf.desc}</div>
            <div class="item-count">Owned: ${prod.count}</div>
          </div>
          <button class="buy-btn ${affordable ? 'affordable' : 'locked'}" 
                  onclick="buyProducer('${key}')">
            ${prod.cost.toFixed(1)}
          </button>
        `;
        container.appendChild(card);
      }
    }

    function renderUpgrades() {
      const container = document.getElementById("upgrades-tab");
      container.innerHTML = "";

      let count = 0;
      for (let key in state.upgrades) {
        const upg = state.upgrades[key];
        if (upg.bought) continue;

        count++;
        const conf = UPGRADE_CONFIG[key];
        const affordable = state.clicks >= upg.cost;

        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <img src="${conf.img}" class="item-img" alt="${conf.name}">
          <div class="item-info">
            <div class="item-title">${conf.name}</div>
            <div class="item-desc">${conf.desc}</div>
          </div>
          <button class="buy-btn ${affordable ? 'affordable' : 'locked'}" 
                  onclick="buyUpgrade('${key}')">
            ${upg.cost.toFixed(1)}
          </button>
        `;
        container.appendChild(card);
      }

      if (count === 0) {
        container.innerHTML = `<div style="text-align:center; color:#888; padding:20px;">All Upgrades Purchased!</div>`;
      }
    }

    function updateUI() {
      document.getElementById("clicks-display").innerText = `${state.clicks.toFixed(2)} Jorma Clicks`;
      document.getElementById("cps-display").innerText = `Per sec: ${getTotalCps().toFixed(2)} | Click: +${getClickPower().toFixed(2)}`;

      document.querySelectorAll("#shop-tab .item-card").forEach((card, idx) => {
        const key = Object.keys(state.producers)[idx];
        const prod = state.producers[key];
        const btn = card.querySelector(".buy-btn");
        const countText = card.querySelector(".item-count");

        if (btn) {
          btn.innerText = prod.cost.toFixed(1);
          btn.className = `buy-btn ${state.clicks >= prod.cost ? 'affordable' : 'locked'}`;
        }
        if (countText) {
          countText.innerText = `Owned: ${prod.count}`;
        }
      });

      document.querySelectorAll("#upgrades-tab .item-card").forEach((card) => {
        const btn = card.querySelector(".buy-btn");
        const onclickAttr = btn ? btn.getAttribute("onclick") : "";
        if (onclickAttr) {
          const match = onclickAttr.match(/'([^']+)'/);
          if (match) {
            const key = match[1];
            const upg = state.upgrades[key];
            if (upg && btn) {
              btn.className = `buy-btn ${state.clicks >= upg.cost ? 'affordable' : 'locked'}`;
            }
          }
        }
      });
    }

    let lastTick = Date.now();

    setInterval(() => {
      const now = Date.now();
      const delta = (now - lastTick) / 1000;
      lastTick = now;

      const cps = getTotalCps();
      if (cps > 0) {
        state.clicks += cps * delta;
        updateUI();
      }
    }, 100);

    function saveGame() {
      state.lastSaved = Date.now();
      localStorage.setItem(GAME_KEY, JSON.stringify(state));
    }

    function loadGame() {
      const raw = localStorage.getItem(GAME_KEY);
      if (raw) {
        try {
          const loaded = JSON.parse(raw);

          if (typeof loaded.clicks === 'number') state.clicks = loaded.clicks;
          
          if (loaded.producers) {
            for (let k in loaded.producers) {
              if (state.producers[k]) {
                state.producers[k].count = loaded.producers[k].count || 0;
                state.producers[k].cost = loaded.producers[k].cost || state.producers[k].cost;
              }
            }
          }

          if (loaded.upgrades) {
            for (let k in loaded.upgrades) {
              if (state.upgrades[k]) {
                state.upgrades[k].bought = !!loaded.upgrades[k].bought;
              }
            }
          }

          if (loaded.lastSaved) {
            const elapsedSeconds = (Date.now() - loaded.lastSaved) / 1000;
            if (elapsedSeconds > 3) {
              const offlineGains = getTotalCps() * elapsedSeconds;
              if (offlineGains > 0) {
                state.clicks += offlineGains;
                showToast(`Welcome back! Earned +${offlineGains.toFixed(1)} clicks offline.`);
              }
            }
          }
        } catch(e) {
          console.error("Save load error:", e);
        }
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3500);
    }

    setInterval(saveGame, 3000);
    window.addEventListener("beforeunload", saveGame);

    document.addEventListener("contextmenu", (e) => e.preventDefault());

    document.addEventListener("keydown", (e) => {
      if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.key === "C" || e.key === "c")) ||
        (e.ctrlKey && (e.key === "U" || e.key === "u" || e.key === "S" || e.key === "s"))
      ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    });

    loadGame();
    renderShop();
    renderUpgrades();
    updateUI();
  </script>
</body>
</html>
